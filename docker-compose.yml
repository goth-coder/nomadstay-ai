services:
    api:
        container_name: hotel_agent_api
        image: hotel_agent_api:latest
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "127.0.0.1:8000:8000"
        env_file:
            - .env
        volumes:
          - ${USERPROFILE}/.aws:/home/app/.aws:ro
        restart: unless-stopped
